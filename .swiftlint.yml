# SwiftLint 설정 파일

# 제외할 경로
excluded:
  - Derived
  - .build
  - Tuist
  - "**/.build"

# 포함할 경로
included:
  - FoodPick
  - Core
  - Domain
  - Data
  - Presentation

# 비활성화할 규칙
disabled_rules:
  - trailing_whitespace
  - explicit_type_interface

# 활성화할 opt-in 규칙
opt_in_rules:
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - sorted_first_last
  - closure_spacing
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_xctest_method
  - fatal_error_message
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - toggle_bool
  - trailing_closure
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

# 라인 길이 설정
line_length:
  warning: 120
  error: 150
  ignores_function_declarations: true
  ignores_comments: true
  ignores_urls: true

# 파일 길이 설정
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

# 함수 길이 설정
function_body_length:
  warning: 50
  error: 100

# 타입 길이 설정
type_body_length:
  warning: 300
  error: 500

# 중첩 타입 설정
nesting:
  type_level: 2

# Identifier 이름 설정
identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 30
    error: 40
  excluded:
    - id
    - to
    - x
    - y

# 기타 규칙 설정
force_cast: warning
force_try: warning
force_unwrapping: warning

# 사용자 정의 규칙
custom_rules:
  # 강제 캐스팅 경고
  force_cast_warning:
    name: "Force Cast"
    regex: "as!"
    message: "Force cast는 피해주세요. as? 또는 guard let을 사용하세요."
    severity: warning

  # 강제 언래핑 경고
  force_unwrap_warning:
    name: "Force Unwrap"
    regex: '([a-zA-Z0-9_)\]]!)(?!\s*=)'
    message: "강제 언래핑(!)은 피해주세요. if let 또는 guard let을 사용하세요."
    severity: warning

  # print 사용 경고
  no_print:
    name: "No Print"
    regex: '\bprint\s*\('
    message: "print는 디버깅 목적으로만 사용하고, 프로덕션 코드에서는 제거해주세요."
    severity: warning
